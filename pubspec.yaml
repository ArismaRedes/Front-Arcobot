name: front_arcobot
description: Frontend app for ArcoBot.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.8.0+1
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  logto_dart_sdk:
    path: packages/logto_dart_sdk
  flutter_web_auth_2: ^4.1.0
  flutter_svg: ^2.0.10+1
  mobile_scanner: ^5.2.3
  lottie: ^3.3.2
  audioplayers: ^6.7.1
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/perrito_ventana.png
    - assets/images/robot_asomado.png
    - assets/images/auth/
    - assets/images/brand/
    - assets/images/characters/
    - assets/images/dashboard/
    - assets/audio/sfx/
    - assets/audio/voice/
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
